# Production config
# All sensitive and environment-specific values MUST be set via env variables.
# Placeholders below exist only because cleanenv requires non-empty YAML
# values for env-required fields — they will be overridden at runtime.

server:
  http:
    host: "0.0.0.0"
    port: 8080 # override: SSO_SERVER_HTTP_PORT
    read_timeout: 15s # override: SSO_SERVER_HTTP_READ_TIMEOUT
    write_timeout: 30s # override: SSO_SERVER_HTTP_WRITE_TIMEOUT
    shutdown_timeout: 15s # override: SSO_SERVER_HTTP_SHUTDOWN_TIMEOUT
    base_url: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_SERVER_HTTP_BASE_URL
    max_body_size: 1048576 # override: SSO_SERVER_HTTP_MAX_BODY_SIZE
  grpc:
    host: "0.0.0.0"
    port: 50051    # override: SSO_SERVER_GRPC_PORT
    api_key: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_SERVER_GRPC_API_KEY

database:
  postgres:
    dsn: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_DATABASE_POSTGRES_DSN
    max_conns: 25
    min_conns: 5
    max_conn_lifetime: 30m
    max_conn_idle_time: 5m
  redis:
    addr: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_DATABASE_REDIS_ADDR
    password: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_DATABASE_REDIS_PASSWORD
    db: 0 # override: SSO_DATABASE_REDIS_DB
    dial_timeout: 5s # override: SSO_DATABASE_REDIS_DIAL_TIMEOUT
    read_timeout: 3s # override: SSO_DATABASE_REDIS_READ_TIMEOUT
    write_timeout: 3s # override: SSO_DATABASE_REDIS_WRITE_TIMEOUT
    pool_size: 20 # override: SSO_DATABASE_REDIS_POOL_SIZE
    min_idle_conns: 5 # override: SSO_DATABASE_REDIS_MIN_IDLE_CONNS
    conn_max_idle_time: 30m # override: SSO_DATABASE_REDIS_CONN_MAX_IDLE_TIME

auth:
  access_token_ttl: 15m # override: SSO_AUTH_ACCESS_TOKEN_TTL
  refresh_token_ttl: 168h # override: SSO_AUTH_REFRESH_TOKEN_TTL
  mfa_token_ttl: 5s # override: SSO_AUTH_REFRESH_TOKEN_TTL
  magic_link_ttl: 15m # override: SSO_MAGIC_LINK_TTL
  issuer: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_AUTH_ISSUER
  audience: "sso" # override: SSO_AUTH_AUDIENCE
  jwt_signing_algorithm: "EdDSA" # override: SSO_AUTH_JWT_SIGNING_ALGORITHM
  verification_ttl: 24h # override: SSO_AUTH_VERIFICATION_TTL
  reset_ttl: 1h # override: SSO_AUTH_RESET_TTL

oauth:
  auth_code_ttl: 60s

federation:
  state_ttl: 10m
  google:
    client_id: "MUST_BE_SET_VIA_ENV"
    client_secret: "MUST_BE_SET_VIA_ENV"
    redirect_url: "MUST_BE_SET_VIA_ENV"
  github:
    client_id: "MUST_BE_SET_VIA_ENV"
    client_secret: "MUST_BE_SET_VIA_ENV"
    redirect_url: "MUST_BE_SET_VIA_ENV"

mfa:
  totp:
    issuer: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_MFA_TOTP_ISSUER
    skew: 1 # override: SSO_MFA_TOTP_SKEW

security:
  encryption_key: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_SECURITY_ENCRYPTION_KEY
  cors:
    allow_origins: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_SECURITY_CORS_ALLOW_ORIGINS
    allow_methods: "GET, POST, OPTIONS" # override: SSO_SECURITY_CORS_ALLOW_METHODS
    allow_headers: "Content-Type, Authorization, X-Request-ID" # override: SSO_SECURITY_CORS_ALLOW_HEADERS
    expose_headers: "X-Request-ID" # override: SSO_SECURITY_CORS_EXPOSE_HEADERS
    max_age: "86400" # override: SSO_SECURITY_CORS_MAX_AGE
  rate_limit:
    login:
      max_attempts: 10
      window: 15m
    totp:
      max_attempts: 3
      window: 5m
    magic_link:
      max_attempts: 3
      window: 15m

observability:
  log:
    level: "info" # override: SSO_LOG_LEVEL
    format: "json" # override: SSO_LOG_FORMAT
  metrics:
    enabled: true # override: SSO_METRICS_ENABLED
    path: "/metrics" # override: SSO_METRICS_PATH
  tracing:
    enabled: true # override: SSO_TRACING_ENABLED
    exporter: "otlp" # override: SSO_TRACING_EXPORTER
    endpoint: "MUST_BE_SET_VIA_ENV" # REQUIRED: SSO_TRACING_ENDPOINT
