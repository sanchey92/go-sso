server:
  http:
    host: "0.0.0.0"
    port: 8080
    read_timeout: 10s
    write_timeout: 30s
    shutdown_timeout: 10s
    drain_timeout: 5s
    base_url: "http://localhost:8080"
    max_body_size: 1048576
  grpc:
    host: "0.0.0.0"
    port: 50051
    api_key: "dev-grpc-api-key-change-me"

database:
  postgres:
    dsn: "postgres://sso:sso@localhost:5432/sso?sslmode=disable" # override via .env SSO_DATABASE_POSTGRES_DSN
    max_conns: 25
    min_conns: 5
    max_conn_lifetime: 30m
    max_conn_idle_time: 5m
  redis:
    addr: "localhost:6379"
    password: "" # override via .env SSO_DATABASE_REDIS_PASSWORD
    db: 0
    dial_timeout: 5s
    read_timeout: 3s
    write_timeout: 3s
    pool_size: 10
    min_idle_conns: 2
    conn_max_idle_time: 30m

auth:
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  mfa_token_ttl: 5m
  magic_link_ttl: 15m
  issuer: "http://localhost:8080" # override via .env SSO_AUTH_ISSUER
  audience: "sso"
  jwt_signing_algorithm: "EdDSA"
  verification_ttl: 24h
  reset_ttl: 1h

oauth:
  auth_code_ttl: 60s

federation:
  state_ttl: 10m
  google:
    client_id: "test-google-client-id"
    client_secret: "test-google-client-secret"
    redirect_url: "http://localhost:8080/api/v1/auth/google/callback"
  github:
    client_id: "test-github-client-id"
    client_secret: "test-github-client-secret"
    redirect_url: "http://localhost:8080/api/v1/auth/github/callback"

mfa:
  totp:
    issuer: "MySSO"
    skew: 1

security:
  encryption_key: "stub-encryption-key-change-me-32" # override via .env SSO_SECURITY_ENCRYPTION_KEY
  cors:
    allow_origins: "*"
    allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
    allow_headers: "Content-Type, Authorization, X-Request-ID"
    expose_headers: "X-Request-ID"
    max_age: "86400"
  hsts:
    enabled: false
  rate_limit:
    login:
      max_attempts: 10
      window: 15m
    totp:
      max_attempts: 5
      window: 5m
    magic_link:
      max_attempts: 3
      window: 15m

observability:
  log:
    level: "debug"
    format: "console"
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"
  tracing:
    enabled: false
    exporter: "otlp"
    endpoint: "localhost:4317"
